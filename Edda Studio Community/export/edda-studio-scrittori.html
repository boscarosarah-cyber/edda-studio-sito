  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

f493fb0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   EDDA STUDIO — sistema visivo condiviso\n   Nero #0E0E0E · Rosso #E8002D · Bianco caldo #F5F5F0\n   Display: Archivo (extended/black, sostituto di Pragmatica)\n   Corpo:   Courier Prime (sostituto di Courier Std)\n   Tutto allineato a sinistra. Spazi generosi. Linee rosse.\n   ============================================================ */\n\n:root{\n  --ink:#0E0E0E;\n  --red:#E8002D;\n  --paper:#F5F5F0;\n  --white:#FFFFFF;\n  --ink-2:#555555;\n  --rule:#888888;\n  --box:#F0F0F0;\n\n  --maxw:1180px;\n  --pad: clamp(20px, 5vw, 64px);\n  --sec: clamp(64px, 10vw, 132px);   /* ritmo verticale fra sezioni */\n\n  --nav-h: 68px;\n\n  --font-display:'Archivo', 'Arial Black', Arial, sans-serif;\n  --font-body:'Courier Prime', 'Courier New', Courier, monospace;\n}\n\n*{ box-sizing:border-box; }\n\nhtml{ -webkit-text-size-adjust:100%; }\n\nbody{\n  margin:0;\n  background:var(--paper);\n  color:var(--ink);\n  font-family:var(--font-body);\n  font-size:17px;\n  line-height:1.72;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\n\n::selection{ background:var(--red); color:var(--paper); }\n\na{ color:inherit; text-decoration:none; }\nimg{ display:block; max-width:100%; }\n\n/* ---------- Display / titoli ---------- */\n.display{\n  font-family:var(--font-display);\n  font-weight:900;\n  font-stretch:125%;\n  text-transform:uppercase;\n  line-height:0.94;\n  letter-spacing:-0.005em;\n  margin:0;\n}\nh1,h2,h3,h4{ font-family:var(--font-display); font-weight:900; font-stretch:125%; text-transform:uppercase; margin:0; }\n\n.d1{ font-size:clamp(3.1rem, 8.6vw, 7.2rem); line-height:0.9; letter-spacing:-0.01em; }\n.d2{ font-size:clamp(2.3rem, 5.4vw, 4rem);  line-height:0.94; }\n.d3{ font-size:clamp(1.6rem, 3.1vw, 2.35rem); line-height:1.0; }\n.d4{ font-size:clamp(1.15rem,1.8vw,1.45rem); line-height:1.1; letter-spacing:0.01em; }\n\n.red{ color:var(--red); }\n.ink{ color:var(--ink); }\n\n/* ---------- Eyebrow ---------- */\n.eyebrow{\n  font-family:var(--font-display);\n  font-weight:800;\n  font-stretch:125%;\n  text-transform:uppercase;\n  color:var(--red);\n  font-size:0.72rem;\n  letter-spacing:0.22em;\n  line-height:1.4;\n  margin:0 0 22px;\n  display:block;\n}\n.eyebrow.on-dark{ color:var(--red); }\n\n/* ---------- Linea rossa (firma grafica) ---------- */\n.rule-red{ width:64px; height:5px; background:var(--red); border:0; margin:0 0 30px; }\n.rule-red.wide{ width:100%; }\n.hr-thin{ border:0; border-top:1px solid var(--rule); opacity:.5; margin:0; }\n\n/* ---------- Corpo testo ---------- */\n.lede{ font-size:1.18rem; line-height:1.7; max-width:62ch; }\n.body-col{ max-width:64ch; }\n.body-col p{ margin:0 0 1.25em; }\np{ text-wrap:pretty; }\n.meta{ color:var(--ink-2); font-size:0.82rem; letter-spacing:0.02em; }\n\n/* ---------- Layout helpers ---------- */\n.wrap{ max-width:var(--maxw); margin:0 auto; padding-inline:var(--pad); }\n.section{ padding-block:var(--sec); }\n.section.tight{ padding-block:clamp(44px,6vw,80px); }\n\n/* ---------- Navbar ---------- */\n.nav{\n  position:sticky; top:0; z-index:50;\n  background:rgba(245,245,240,0.92);\n  backdrop-filter:saturate(120%) blur(8px);\n  border-bottom:1px solid rgba(14,14,14,0.12);\n}\n.nav-inner{\n  max-width:1320px; margin:0 auto; padding:0 var(--pad);\n  height:var(--nav-h);\n  display:flex; align-items:center; justify-content:space-between;\n}\n.logo{\n  font-family:var(--font-display); font-weight:900; font-stretch:125%;\n  text-transform:uppercase; font-size:1.32rem; letter-spacing:0.005em;\n  color:var(--ink); white-space:nowrap;\n}\n.logo .red{ color:var(--red); }\n.nav-links{ display:flex; align-items:center; gap:clamp(14px,2vw,30px); list-style:none; margin:0; padding:0; }\n.nav-links a{\n  font-family:var(--font-body);\n  font-size:0.82rem; letter-spacing:0.02em;\n  color:var(--ink); padding:6px 0; position:relative; white-space:nowrap;\n}\n.nav-links a::after{\n  content:\"\"; position:absolute; left:0; right:100%; bottom:0; height:2px; background:var(--red);\n  transition:right .28s ease;\n}\n.nav-links a:hover::after, .nav-links a.active::after{ right:0; }\n.nav-links a.active{ color:var(--ink); }\n\n.nav-toggle{ display:none; background:none; border:0; cursor:pointer; padding:8px; }\n.nav-toggle span{ display:block; width:24px; height:2px; background:var(--ink); margin:5px 0; transition:.25s; }\n\n@media (max-width:880px){\n  .nav-toggle{ display:block; }\n  .nav-links{\n    position:fixed; inset:var(--nav-h) 0 auto 0;\n    flex-direction:column; align-items:flex-start; gap:0;\n    background:var(--paper); border-bottom:1px solid rgba(14,14,14,.15);\n    padding:8px var(--pad) 22px;\n    transform:translateY(-120%); transition:transform .3s ease; max-height:calc(100vh - var(--nav-h)); overflow:auto;\n  }\n  .nav.open .nav-links{ transform:translateY(0); }\n  .nav-links a{ width:100%; padding:14px 0; border-bottom:1px solid rgba(14,14,14,.08); font-size:0.95rem; }\n  .nav-links a::after{ display:none; }\n  .nav.open .nav-toggle span:nth-child(1){ transform:translateY(7px) rotate(45deg); }\n  .nav.open .nav-toggle span:nth-child(2){ opacity:0; }\n  .nav.open .nav-toggle span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }\n}\n\n/* ---------- Bottoni ---------- */\n.btn{\n  display:inline-flex; align-items:center; gap:0.7em;\n  font-family:var(--font-display); font-weight:800; font-stretch:125%;\n  text-transform:uppercase; font-size:0.82rem; letter-spacing:0.08em;\n  padding:15px 22px; border:2px solid var(--red); background:var(--red); color:var(--paper);\n  cursor:pointer; transition:background .2s, color .2s, border-color .2s; line-height:1;\n}\n.btn .arr{ font-family:var(--font-body); font-weight:700; transition:transform .2s; }\n.btn:hover{ background:var(--ink); border-color:var(--ink); color:var(--paper); }\n.btn:hover .arr{ transform:translateX(4px); }\n\n.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--ink); }\n.btn.ghost:hover{ background:var(--ink); color:var(--paper); }\n.btn.on-dark{ background:var(--paper); border-color:var(--paper); color:var(--ink); }\n.btn.on-dark:hover{ background:var(--red); border-color:var(--red); color:var(--paper); }\n.btn.ghost.on-dark{ background:transparent; color:var(--paper); border-color:var(--paper); }\n.btn.ghost.on-dark:hover{ background:var(--paper); color:var(--ink); }\n\n/* link-CTA secondario (sottolineato) */\n.link-cta{\n  display:inline-flex; align-items:center; gap:0.5em; white-space:nowrap;\n  font-family:var(--font-body); font-weight:700; font-size:0.92rem;\n  color:var(--ink); border-bottom:2px solid var(--red); padding-bottom:3px; line-height:1.3;\n  transition:color .2s;\n}\n.link-cta .arr{ color:var(--red); transition:transform .2s; }\n.link-cta:hover{ color:var(--red); }\n.link-cta:hover .arr{ transform:translateX(4px); }\n.link-cta.on-dark{ color:var(--paper); }\n.link-cta.on-dark:hover{ color:var(--red); }\n\n.cta-row{ display:flex; flex-wrap:wrap; gap:18px 26px; align-items:center; margin-top:34px; }\n\n/* ---------- Sezione scura (breakout) ---------- */\n.dark{ background:var(--ink); color:var(--paper); }\n.dark .meta{ color:#b9b9b3; }\n.dark .hr-thin{ border-color:#3a3a38; opacity:1; }\n\n/* ---------- Numero romano grande ---------- */\n.roman{\n  font-family:var(--font-display); font-weight:900; font-stretch:125%;\n  color:var(--red); font-size:clamp(2.2rem,4.5vw,3.4rem); line-height:1;\n}\n\n/* ---------- Cards generiche ---------- */\n.card{\n  background:var(--white); border:1.5px solid var(--ink);\n  padding:clamp(26px,3vw,44px);\n  display:flex; flex-direction:column; gap:18px; height:100%;\n}\n.card .roman{ margin-bottom:2px; }\n.card h3{ font-size:clamp(1.4rem,2.4vw,2rem); line-height:1.0; }\n.card p{ margin:0; }\n.card .link-cta{ margin-top:auto; }\n\n.grid{ display:grid; gap:clamp(18px,2.4vw,28px); }\n.grid-2{ grid-template-columns:repeat(2,1fr); }\n.grid-3{ grid-template-columns:repeat(3,1fr); }\n.grid-4{ grid-template-columns:repeat(4,1fr); }\n@media (max-width:900px){ .grid-3,.grid-4{ grid-template-columns:repeat(2,1fr); } }\n@media (max-width:640px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } }\n\n/* ---------- Header di pagina (hero interni) ---------- */\n.page-hero{ padding-top:clamp(56px,8vw,104px); padding-bottom:clamp(40px,6vw,72px); }\n.page-hero .d1, .page-hero .d2{ margin-bottom:26px; }\n\n/* ---------- Lista numerata \"passaggi/elementi\" ---------- */\n.steps{ display:flex; flex-direction:column; }\n.step{\n  display:grid; grid-template-columns:minmax(90px,140px) 1fr; gap:clamp(20px,4vw,56px);\n  padding:clamp(30px,4vw,46px) 0; border-top:1px solid rgba(14,14,14,.16);\n}\n.step:last-child{ border-bottom:1px solid rgba(14,14,14,.16); }\n.step h3{ font-size:clamp(1.35rem,2.4vw,1.9rem); margin-bottom:14px; line-height:1.0; }\n.step .step-body{ max-width:64ch; }\n.step .kv{ margin:0; }\n.step .kv b{ font-weight:700; color:var(--ink); }\n@media (max-width:640px){ .step{ grid-template-columns:1fr; gap:10px; } .step .roman{ font-size:2.4rem; } }\n\n/* ---------- Box informativo ---------- */\n.infobox{ background:var(--box); border-top:5px solid var(--red); padding:clamp(26px,3vw,40px); }\n.infobox.outline{ background:var(--white); border:1.5px solid var(--ink); border-top:5px solid var(--red); }\n\n/* ---------- Accordion FAQ ---------- */\n.faq{ border-top:1px solid rgba(14,14,14,.18); }\n.faq-item{ border-bottom:1px solid rgba(14,14,14,.18); }\n.faq-q{\n  width:100%; text-align:left; background:none; border:0; cursor:pointer;\n  display:flex; justify-content:space-between; align-items:flex-start; gap:24px;\n  padding:24px 0; font-family:var(--font-body); font-weight:700; font-size:1.02rem; color:var(--ink); line-height:1.4;\n}\n.faq-q .sign{ font-family:var(--font-display); font-weight:900; color:var(--red); font-size:1.4rem; line-height:1; flex:none; transition:transform .25s; }\n.faq-item.open .faq-q .sign{ transform:rotate(45deg); }\n.faq-a{ max-height:0; overflow:hidden; transition:max-height .35s ease; }\n.faq-a .faq-a-in{ padding:0 0 26px; max-width:70ch; color:var(--ink); }\n\n/* ---------- Form ---------- */\n.form{ display:flex; gap:0; max-width:520px; border:2px solid var(--ink); background:var(--white); }\n.form input[type=email]{\n  flex:1; border:0; background:transparent; padding:16px 18px;\n  font-family:var(--font-body); font-size:1rem; color:var(--ink); min-width:0;\n}\n.form input:focus{ outline:none; }\n.form button{\n  border:0; background:var(--red); color:var(--paper); cursor:pointer;\n  font-family:var(--font-display); font-weight:800; font-stretch:125%; text-transform:uppercase;\n  letter-spacing:0.08em; font-size:0.82rem; padding:0 24px; display:flex; align-items:center; gap:0.6em;\n  transition:background .2s;\n}\n.form button:hover{ background:var(--ink); }\n.form.on-dark{ border-color:var(--paper); background:transparent; }\n.form.on-dark input{ color:var(--paper); }\n.form.on-dark input::placeholder{ color:#9b9b95; }\n.microcopy{ margin-top:14px; font-size:0.78rem; color:var(--ink-2); }\n.dark .microcopy{ color:#9b9b95; }\n.form-done{ font-family:var(--font-body); font-weight:700; color:var(--ink); padding:6px 0; }\n.form-done .red{ color:var(--red); }\n.dark .form-done{ color:var(--paper); }\n@media (max-width:460px){ .form{ flex-direction:column; } .form button{ padding:14px; justify-content:center; } }\n\n/* full contact form */\n.cform{ display:grid; gap:18px; max-width:560px; }\n.cform label{ font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:8px; font-family:var(--font-display); font-weight:700; font-stretch:125%;}\n.cform input, .cform textarea{\n  width:100%; border:2px solid var(--ink); background:var(--white); padding:14px 16px;\n  font-family:var(--font-body); font-size:1rem; color:var(--ink);\n}\n.cform textarea{ min-height:140px; resize:vertical; }\n.cform input:focus, .cform textarea:focus{ outline:none; border-color:var(--red); }\n\n/* ---------- Footer ---------- */\n.footer{ background:var(--ink); color:var(--paper); padding-block:clamp(54px,7vw,92px); }\n.footer .logo{ color:var(--paper); font-size:clamp(2rem,5vw,3.4rem); }\n.footer .logo .red{ color:var(--red); }\n.foot-top{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:clamp(24px,3vw,40px); align-items:start; }\n.foot-tag{ color:#c9c9c3; max-width:34ch; margin-top:18px; line-height:1.6; }\n.foot-col h4{ font-size:0.74rem; letter-spacing:0.2em; color:var(--red); margin-bottom:18px; font-stretch:125%; }\n.foot-col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }\n.foot-col a{ color:#dededa; font-size:0.92rem; }\n.foot-col a:hover{ color:var(--red); }\n.foot-bottom{ margin-top:clamp(40px,5vw,68px); padding-top:22px; border-top:1px solid #333; display:flex; flex-wrap:wrap; gap:8px 18px; }\n.foot-bottom, .foot-bottom a{ color:#8a8a85; font-size:0.74rem; letter-spacing:0.03em; }\n.foot-bottom a:hover{ color:var(--red); }\n@media (max-width:820px){ .foot-top{ grid-template-columns:1fr 1fr; } }\n@media (max-width:520px){ .foot-top{ grid-template-columns:1fr; } }\n\n/* ---------- image-slot styling default ---------- */\nimage-slot{ background:var(--box); display:block; }\n\n/* ---------- Reveal allo scroll ---------- */\n.reveal{ opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s ease; }\n.reveal.in{ opacity:1; transform:none; }\n@media (prefers-reduced-motion:reduce){ .reveal{ opacity:1; transform:none; transition:none; } }\n\n/* utilità */\n.mt-s{ margin-top:18px; } .mt-m{ margin-top:34px; } .mt-l{ margin-top:56px; }\n.mb-0{ margin-bottom:0; }\n.measure{ max-width:30ch; }\n.split{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:clamp(30px,5vw,72px); align-items:center; }\n@media (max-width:860px){ .split{ grid-template-columns:1fr; gap:36px; } }\n<\u002Fstyle>\n\n<style>\n  .pillar{ background:var(--white); border:1.5px solid var(--ink); padding:clamp(26px,3vw,40px); display:flex; flex-direction:column; gap:18px; height:100%; }\n  .pillar .roman{ font-size:clamp(2.2rem,4vw,3.2rem); }\n  .pillar h3{ font-size:clamp(1.35rem,2.2vw,1.85rem); line-height:1.0; }\n  .pillar p{ margin:0; }\n  .pillar dl{ margin:0; display:flex; flex-direction:column; gap:14px; }\n  .pillar dt{ font-family:var(--font-display); font-weight:800; font-stretch:125%; text-transform:uppercase; color:var(--red); font-size:0.66rem; letter-spacing:0.14em; margin-bottom:5px; }\n  .pillar dd{ margin:0; }\n  .pillar .meta-row{ margin-top:auto; border-top:1px solid rgba(14,14,14,.14); padding-top:16px; }\n  .big-sel{ font-family:var(--font-display); font-weight:900; font-stretch:125%; text-transform:uppercase; font-size:clamp(2rem,5vw,3.6rem); line-height:0.98; max-width:18ch; }\n  .oplist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }\n  .oplist li{ padding:16px 0; border-top:1px solid rgba(14,14,14,.14); display:flex; gap:16px; }\n  .oplist li::before{ content:\"—\"; color:var(--red); font-weight:700; }\n  .oplist li:last-child{ border-bottom:1px solid rgba(14,14,14,.14); }\n  .fit-list{ list-style:none; margin:0; padding:0; display:grid; gap:0; }\n  .fit-list li{ display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:baseline; padding:15px 0; border-top:1px solid rgba(14,14,14,.16); }\n  .fit-list li:last-child{ border-bottom:1px solid rgba(14,14,14,.16); }\n  .fit-list .mk{ color:var(--red); font-family:var(--font-display); font-weight:900; font-stretch:125%; font-size:1.1rem; line-height:1; }\n  .author-card{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:clamp(24px,4vw,56px); align-items:center; border:1.5px solid var(--ink); background:var(--white); padding:clamp(24px,3vw,40px); }\n  @media(max-width:720px){ .author-card{ grid-template-columns:1fr; } }\n  .author-card image-slot{ width:100%; aspect-ratio:3/4; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"nav\">\n  <div class=\"nav-inner\">\n    <a class=\"logo\" href=\"index.html\">EDDA<span class=\"red\">STUDIO<\u002Fspan><\u002Fa>\n    <button class=\"nav-toggle\" aria-label=\"Apri il menu\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n    <nav><ul class=\"nav-links\">\n      <li><a href=\"scrittori.html\">Scrittori<\u002Fa><\u002Fli>\n      <li><a href=\"esperienze.html\">Esperienze<\u002Fa><\u002Fli>\n      <li><a href=\"reading-circle.html\">Reading Circle<\u002Fa><\u002Fli>\n      <li><a href=\"manifesto.html\">Manifesto<\u002Fa><\u002Fli>\n      <li><a href=\"la-casa.html\">La casa<\u002Fa><\u002Fli>\n    <\u002Ful><\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n  <!-- HERO -->\n  <section class=\"page-hero\" data-screen-label=\"Scrittori — Hero\">\n    <div class=\"wrap reveal\">\n      <span class=\"eyebrow\">Per gli scrittori &nbsp;·&nbsp; Il primo motore della casa<\u002Fspan>\n      <h1 class=\"d1\">Sviluppiamo<br><span class=\"red\">carriere d’autore.<\u002Fspan><\u002Fh1>\n      <hr class=\"rule-red\" style=\"margin-top:30px\">\n      <p class=\"lede mt-m\" style=\"max-width:56ch\">Non cerchiamo case editrici per te. Costruiamo tutto quello che serve perché tu, come autrice o autore, esista nel mondo: riconoscibile, professionale, presente, con un pubblico che ti aspetta.<\u002Fp>\n      <div class=\"cta-row\">\n        <a class=\"btn\" href=\"mailto:autori@eddastudio.it?subject=Lettera per Edda Studio\">Scrivimi una lettera <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PER CHI È -->\n  <section class=\"section tight\" data-screen-label=\"Scrittori — Per chi è\">\n    <div class=\"wrap\">\n      <div class=\"split\">\n        <div class=\"reveal\">\n          <span class=\"eyebrow\">Per chi è, e per chi no<\u002Fspan>\n          <h2 class=\"d2\">Prima di continuare,<br>due cose.<\u002Fh2>\n          <hr class=\"rule-red\" style=\"margin-top:30px\">\n        <\u002Fdiv>\n        <div class=\"reveal body-col\" data-delay=\"120\">\n          <p>Edda Studio non è un’agenzia letteraria classica. Non facciamo scouting per case editrici, non firmiamo contratti per conto tuo, non gestiamo diritti. Se cerchi un agente, possiamo indicarti professionisti seri — ma non siamo noi.<\u002Fp>\n          <p>Il mercato editoriale italiano è sempre più affollato e sempre più povero: gli editori medi e piccoli non hanno più risorse per accompagnare gli autori. Chi vuole esistere deve costruirsi il proprio mondo. Noi costruiamo mondi attorno agli autori — con lentezza, coerenza, presenza.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <ul class=\"fit-list reveal mt-l\" style=\"max-width:880px\">\n        <li><span class=\"mk\">→<\u002Fspan><span>Lavoriamo con chi ha una <b>voce<\u002Fb> e vuole costruirci sopra una carriera lunga.<\u002Fspan><\u002Fli>\n        <li><span class=\"mk\">→<\u002Fspan><span>Con chi pubblica con un <b>editore indipendente<\u002Fb> e vuole un pubblico suo.<\u002Fspan><\u002Fli>\n        <li><span class=\"mk\">→<\u002Fspan><span>Con chi si <b>autopubblica con serietà<\u002Fb> e vuole smettere di essere invisibile.<\u002Fspan><\u002Fli>\n        <li><span class=\"mk\">→<\u002Fspan><span>Con chi ha un <b>progetto vero<\u002Fb> e ha capito che il libro è il punto di partenza, non quello di arrivo.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- QUATTRO FRONTI -->\n  <section class=\"section\" data-screen-label=\"Scrittori — Quattro fronti\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Cosa facciamo, concretamente<\u002Fspan>\n        <h2 class=\"d2\">I quattro fronti<br>di lavoro.<\u002Fh2>\n        <hr class=\"rule-red\" style=\"margin-top:30px\">\n      <\u002Fdiv>\n      <div class=\"grid grid-2 mt-l\">\n\n        <article class=\"pillar reveal\">\n          <div class=\"roman\">I.<\u002Fdiv>\n          <h3>L’identità d’autore<\u002Fh3>\n          <p>Costruiamo come ti presenti al mondo: la tua voce pubblica, la biografia in tre versioni, la fotografia d’autore, l’identità visiva (con Trama Studio), i materiali di presentazione per stampa, librerie, festival.<\u002Fp>\n          <dl>\n            <div><dt>Cosa ricevi<\u002Fdt><dd>Un documento di posizionamento d’autore, il kit visivo completo, i template per i tuoi canali.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div class=\"meta-row\"><p class=\"meta mb-0\"><b>Con chi lavori:<\u002Fb> Sara (voce e posizionamento) + Daniela (identità visiva).<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"pillar reveal\" data-delay=\"100\">\n          <div class=\"roman\">II.<\u002Fdiv>\n          <h3>L’accompagnamento editoriale<\u002Fh3>\n          <p>Lavoriamo accanto a te mentre il libro prende forma: struttura narrativa, coerenza della voce, posizionamento del progetto nel suo mercato. Non sostituiamo l’editor — costruiamo la cornice dentro cui il tuo libro ha senso.<\u002Fp>\n          <dl>\n            <div><dt>Cosa ricevi<\u002Fdt><dd>Sessioni di lavoro periodiche, un documento di posizionamento narrativo, una mappa del progetto editoriale.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div class=\"meta-row\"><p class=\"meta mb-0\"><b>Con chi lavori:<\u002Fb> Sara.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"pillar reveal\">\n          <div class=\"roman\">III.<\u002Fdiv>\n          <h3>Il lancio nella community<\u002Fh3>\n          <p>Quando il libro è pronto, lo presentiamo dentro la community di Edda Studio: la newsletter, il Reading Circle, il canale Edda Reading Club, i nostri spazi social. Non è pubblicità — è un incontro preparato con cura tra il tuo libro e lettori veri.<\u002Fp>\n          <dl>\n            <div><dt>Cosa ricevi<\u002Fdt><dd>Una campagna di lancio coordinata, la presentazione nella newsletter, un episodio o una conversazione dedicata, l’anteprima per i soci del Reading Circle.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div class=\"meta-row\"><p class=\"meta mb-0\"><b>Con chi lavori:<\u002Fb> tutta la casa.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n\n        <article class=\"pillar reveal\" data-delay=\"100\">\n          <div class=\"roman\">IV.<\u002Fdiv>\n          <h3>Gli eventi dal vivo<\u002Fh3>\n          <p>Organizziamo i tuoi incontri con il pubblico: salon serali, presentazioni in librerie indipendenti, partecipazioni a serate Edda Studio, fino a retreat dedicati alla tua opera quando il percorso matura.<\u002Fp>\n          <dl>\n            <div><dt>Cosa ricevi<\u002Fdt><dd>Un calendario di eventi costruito sul tuo libro, il coordinamento completo, i materiali di comunicazione.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div class=\"meta-row\"><p class=\"meta mb-0\"><b>Con chi lavori:<\u002Fb> Sara + partner selezionati.<\u002Fp><\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SELETTIVITÀ -->\n  <section class=\"dark section\" data-screen-label=\"Scrittori — Selettività\">\n    <div class=\"wrap split\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">La selettività come garanzia<\u002Fspan>\n        <p class=\"big-sel\">Sei autori<br>all’anno. <span class=\"red\">Non uno<br>di più.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" data-delay=\"120\">\n        <div class=\"body-col\" style=\"color:#e6e6e1\">\n          <p>Ogni percorso è seguito personalmente da Sara, dall’inizio alla fine. Niente collaboratori intercambiabili, niente catene di delega. Per questo accogliamo al massimo sei autori all’anno.<\u002Fp>\n          <p>Non è una posa: è la condizione perché il lavoro sia fatto bene. Quando i posti dell’anno sono completi, apriamo una lista per l’anno successivo.<\u002Fp>\n          <p>Ogni percorso è costruito su misura: c’è chi entra per la sola identità d’autore, chi per il lancio di un libro pronto, chi per il percorso completo di dodici mesi. La proposta — contenuti, tempi, investimento — arriva per iscritto dopo la prima conversazione. Niente listini pubblici, niente pacchetti preconfezionati.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CHI È GIÀ IN CASA -->\n  <section class=\"section\" data-screen-label=\"Scrittori — Chi è già in casa\">\n    <div class=\"wrap\">\n      <div class=\"reveal\">\n        <span class=\"eyebrow\">Chi è già in casa<\u002Fspan>\n        <h2 class=\"d2\">I primi percorsi<br>d’autore.<\u002Fh2>\n        <hr class=\"rule-red\" style=\"margin-top:30px\">\n      <\u002Fdiv>\n      <div class=\"author-card reveal mt-l\">\n        <image-slot id=\"ritratto-stefano\" shape=\"rect\" fit=\"cover\" placeholder=\"Trascina qui il ritratto di Stefano (b/n)\"><\u002Fimage-slot>\n        <div>\n          <span class=\"eyebrow\">Primo autore di casa<\u002Fspan>\n          <h3 class=\"d3\">Stefano Bettini<\u002Fh3>\n          <p class=\"meta\" style=\"color:var(--red); font-weight:700; margin:8px 0 18px\">Serie «Uomini in Crisi» &nbsp;·&nbsp; primo romanzo, autunno 2026<\u002Fp>\n          <p class=\"body-col\">Stefano Bettini è il primo autore di casa: la sua serie «Uomini in Crisi» è il primo progetto editoriale costruito interamente dentro Edda Studio, dall’identità al lancio. Accanto a lui, i primi percorsi con autrici e professioniste della scrittura sono in corso — i casi studio arriveranno su questa pagina entro l’autunno.<\u002Fp>\n          <a class=\"link-cta mt-s\" href=\"autori.html\">Conosci Stefano e la sua opera <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COME SI COMINCIA -->\n  <section class=\"section tight\" data-screen-label=\"Scrittori — Come si comincia\">\n    <div class=\"wrap\">\n      <div class=\"reveal\" style=\"max-width:760px\">\n        <span class=\"eyebrow\">Come si comincia<\u002Fspan>\n        <h2 class=\"d2\">Scrivimi<br>una lettera.<\u002Fh2>\n        <hr class=\"rule-red\" style=\"margin-top:30px\">\n        <div class=\"body-col mt-m\">\n          <p>Non un curriculum, non una sinossi, non un manoscritto in allegato. Una lettera vera: chi sei, cosa stai scrivendo, dove vuoi arrivare, perché Edda Studio.<\u002Fp>\n          <p>Leggiamo tutto. Rispondiamo a tutti entro tre giorni lavorativi. Se c’è un’affinità, ci vediamo mezz’ora su Zoom — gratuita, senza impegno. Se decidiamo di lavorare insieme, ricevi una proposta scritta su misura.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"infobox reveal mt-l\" style=\"max-width:760px\">\n        <ul class=\"oplist\" style=\"border-top:0\">\n          <li style=\"border-top:0\"><b>Scrivi a:<\u002Fb>&nbsp;autori@eddastudio.it<\u002Fli>\n          <li><b>Oggetto:<\u002Fb>&nbsp;«Lettera per Edda Studio»<\u002Fli>\n          <li><b>In una sola mail:<\u002Fb>&nbsp;niente allegati di manoscritti.<\u002Fli>\n          <li><b>Risposta:<\u002Fb>&nbsp;entro 3 giorni lavorativi, a tutti.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"cta-row\">\n        <a class=\"btn\" href=\"mailto:autori@eddastudio.it?subject=Lettera per Edda Studio\">Scrivimi una lettera <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"foot-top\">\n      <div>\n        <a class=\"logo\" href=\"index.html\">EDDA<span class=\"red\">STUDIO<\u002Fspan><\u002Fa>\n        <p class=\"foot-tag\">Una casa di lettura italiana.<br>Per chi crede che leggere sia un atto di cura.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4 class=\"display\">Cosa facciamo<\u002Fh4>\n        <ul>\n          <li><a href=\"scrittori.html\">Per gli scrittori<\u002Fa><\u002Fli>\n          <li><a href=\"esperienze.html\">Le esperienze<\u002Fa><\u002Fli>\n          <li><a href=\"reading-circle.html\">Reading Circle<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4 class=\"display\">La casa<\u002Fh4>\n        <ul>\n          <li><a href=\"manifesto.html\">Manifesto<\u002Fa><\u002Fli>\n          <li><a href=\"la-casa.html\">Chi siamo<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h4 class=\"display\">Resta in contatto<\u002Fh4>\n        <ul>\n          <li><a href=\"mailto:info@eddastudio.it\">info@eddastudio.it<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Instagram @eddaedizioni<\u002Fa><\u002Fli>\n          <li><a href=\"#\">LinkedIn @saraboscaro<\u002Fa><\u002Fli>\n          <li><span style=\"color:#8a8a85\">Padova, Italia<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <span>© Edda Studio MMXXVI<\u002Fspan><span>·<\u002Fspan><span>P.IVA [da inserire]<\u002Fspan><span>·<\u002Fspan><a href=\"#\">Privacy<\u002Fa><span>·<\u002Fspan><a href=\"#\">Cookie<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"04b47420-6556-4d2e-96b3-73bd99d1e53b\"><\u002Fscript>\n<script src=\"f94fe5b4-09ec-4e7e-9aba-e8bc80292214\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
